name: Skills name real tools

# Every tool a skill lists must exist on the MCP server. The plugin repo had
# no CI at all, so a renamed or removed tool would sit in a skill's `tools`
# list — and in a SKILL.md credit table — looking authoritative until a user
# hit it. The source of truth here is the LIVE server's `tools/list` at the
# URL the plugin itself points at (.mcp.json): discovery is served without
# credentials, and what the server lists is exactly what a model can call.
# (A checkout of the server repo would need a token this repo does not hold.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so a server-side rename is caught without a plugin push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Every listed tool exists on the live MCP server
        run: |
          python - <<'PY'
          import json, pathlib, re, sys, urllib.request
          url = json.loads(pathlib.Path(".mcp.json").read_text())["mcpServers"]["marketcode"]["url"] if "marketcode" in json.loads(pathlib.Path(".mcp.json").read_text()).get("mcpServers", {}) else next(iter(json.loads(pathlib.Path(".mcp.json").read_text())["mcpServers"].values()))["url"]
          body = {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
          # Cloudflare's browser-integrity check (error 1010) refuses the default
          # Python user agent; a named one passes. Same headers the MCP clients send.
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={
              "Content-Type": "application/json", "Accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": "2025-06-18",
              "User-Agent": "marketcode-plugin-ci/1.0 (+https://github.com/robosapien-ai/marketcode-plugin)",
          })
          raw = urllib.request.urlopen(req, timeout=60).read().decode()
          txt = "".join(l[5:] for l in raw.splitlines() if l.startswith("data:")) if "data:" in raw else raw
          live = {t["name"] for t in json.loads(txt)["result"]["tools"]}
          index = json.loads(pathlib.Path("skills/index.json").read_text())
          listed = {t for s in index["skills"] for t in s.get("tools", [])}
          # SKILL.md prose is not checked token by token: parameter names
          # (`area_code`, `epc_in`) are tool-shaped and legitimately not tools.
          # A tool a skill USES must be in its index.json list, and that list
          # is what the check reads.
          bad_index = sorted(listed - live)
          print(f"live tools: {len(live)}; listed in index.json: {len(listed)}; url: {url}")
          if bad_index:
              print("index.json names tools the server does not serve:", bad_index); sys.exit(1)
          print("ok")
          PY
